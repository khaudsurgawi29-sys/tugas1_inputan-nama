
name: Build C++ to EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install C++ compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compile CPP to EXE
        shell: msys2 {0}
        run: |
          mkdir -p build
          g++ main.cpp -o build/main.exe -std=c++17 -O2 -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: program-exe
          path: build/main.exe
