name: Build C++ to EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest  # Menggunakan runner Windows agar menghasilkan file .exe

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MinGW
      uses: egor-tukin/setup-mingw@v2
      with:
        mingw-version: latest

    - name: Compile with G++
      run: g++ main.cpp -o app.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable
        path: app.exe
